<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef5ff, #d9efff);
    min-height: 100vh;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #555;
}

textarea {
    width: 100%;
    min-height: 280px;
    padding: 15px;
    margin-top: 15px;
    border: 2px solid #bbb;
    border-radius: 12px;
    font-size: 15px;
    resize: vertical;
}

textarea:focus {
    outline: none;
    border-color: #007bff;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 17px;
}

.calculate {
    background: #007bff;
    color: white;
}

.clear {
    background: #eee;
    color: #222;
}

.result {
    margin-top: 25px;
    display: none;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
}

.card {
    padding: 18px 10px;
    background: #f5f7fa;
    border-radius: 12px;
    text-align: center;
}

.card h3 {
    margin: 0 0 10px;
    font-size: 15px;
}

.number {
    font-size: 25px;
    font-weight: bold;
}

#status {
    margin-top: 18px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.subject-section {
    margin-top: 30px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 12px 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #007bff;
    color: white;
}

.good {
    color: green;
    font-weight: bold;
}

.bad {
    color: red;
    font-weight: bold;
}

.error {
    margin-top: 15px;
    padding: 12px;
    background: #ffe5e5;
    color: #a00000;
    border-radius: 8px;
    display: none;
}

@media(max-width:700px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
    }

    h1 {
        font-size: 25px;
    }

    .cards {
        grid-template-columns: repeat(2,1fr);
    }

    .buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Attendance Calculator</h1>

<p class="subtitle">
Copy your Student Attendance data from ERP and paste it below.
</p>

<textarea
id="attendanceData"
placeholder="Paste complete ERP attendance data here..."></textarea>

<div class="buttons">

<button class="calculate" onclick="calculateAttendance()">
Calculate Attendance
</button>

<button class="clear" onclick="clearData()">
Clear
</button>

</div>

<div id="error" class="error"></div>

<div id="result" class="result">

<h2>Overall Attendance</h2>

<div class="cards">

<div class="card">
<h3>Total Classes</h3>
<div class="number" id="total">0</div>
</div>

<div class="card">
<h3>Present</h3>
<div class="number" id="present">0</div>
</div>

<div class="card">
<h3>Absent</h3>
<div class="number" id="absent">0</div>
</div>

<div class="card">
<h3>Attendance</h3>
<div class="number" id="percentage">0%</div>
</div>

</div>

<div id="status"></div>

<div class="subject-section">

<h2>📚 Subject-wise Attendance</h2>

<table>

<thead>
<tr>
<th>Subject</th>
<th>Present</th>
<th>Absent</th>
<th>Total</th>
<th>%</th>
</tr>
</thead>

<tbody id="subjectTable"></tbody>

</table>

</div>

</div>

</div>

<script>

function calculateAttendance() {

    const data = document.getElementById("attendanceData").value;

    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.style.display = "none";

    if (!data.trim()) {

        error.innerText =
        "Please paste your ERP attendance data first.";

        error.style.display = "block";

        result.style.display = "none";

        return;
    }


    const presentMatches =
        data.match(/\bPresent\b/gi) || [];

    const absentMatches =
        data.match(/\bAbsent\b/gi) || [];


    const present = presentMatches.length;
    const absent = absentMatches.length;

    const total = present + absent;


    if (total === 0) {

        error.innerText =
        "No Present or Absent records found. Please paste complete attendance data.";

        error.style.display = "block";

        result.style.display = "none";

        return;
    }


    const percentage =
        ((present / total) * 100).toFixed(2);


    document.getElementById("total").innerText =
        total;

    document.getElementById("present").innerText =
        present;

    document.getElementById("absent").innerText =
        absent;

    document.getElementById("percentage").innerText =
        percentage + "%";


    const status =
        document.getElementById("status");


    if (Number(percentage) >= 75) {

        status.innerHTML =
        "✅ Eligible — Attendance is 75% or above";

        status.style.background =
        "#e4f8e8";

        status.style.color =
        "green";

    } else {

        status.innerHTML =
        "⚠️ Short Attendance — Below 75%";

        status.style.background =
        "#ffe5e5";

        status.style.color =
        "red";
    }


    calculateSubjects(data);

    result.style.display =
    "block";
}



function calculateSubjects(data) {

    const lines =
        data.split(/\r?\n/)
            .map(line => line.trim())
            .filter(Boolean);


    const subjects = {};


    for (let i = 0; i < lines.length; i++) {

        const attendance =
            lines[i].toLowerCase();


        if (
            attendance !== "present" &&
            attendance !== "absent"
        ) {
            continue;
        }


        /*
        ERP copied data normally has:

        Serial
        Date
        Slot
        Start Time
        End Time
        Paper Name
        Attendance

        Therefore Paper Name is normally
        the line immediately before
        Present/Absent.
        */

        let subject = "";

        if (i > 0) {
            subject = lines[i - 1];
        }


        /*
        Prevent accidental detection
        of time/date as subject.
        */

        if (
            !subject ||
            /^\d{1,2}:\d{2}$/.test(subject) ||
            /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(subject)
        ) {
            continue;
        }


        if (!subjects[subject]) {

            subjects[subject] = {
                present: 0,
                absent: 0
            };

        }


        if (attendance === "present") {

            subjects[subject].present++;

        } else {

            subjects[subject].absent++;

        }

    }


    const table =
        document.getElementById("subjectTable");

    table.innerHTML = "";


    Object.keys(subjects)
        .sort()
        .forEach(subject => {

            const info =
                subjects[subject];

            const total =
                info.present +
                info.absent;

            const percent =
                ((info.present / total) * 100)
                .toFixed(2);


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${escapeHTML(subject)}</td>

                <td>${info.present}</td>

                <td>${info.absent}</td>

                <td>${total}</td>

                <td class="${
                    Number(percent) >= 75
                    ? "good"
                    : "bad"
                }">

                ${percent}%

                </td>

            `;


            table.appendChild(row);

        });

}



function escapeHTML(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



function clearData() {

    document.getElementById(
        "attendanceData"
    ).value = "";


    document.getElementById(
        "result"
    ).style.display = "none";


    document.getElementById(
        "error"
    ).style.display = "none";

}

</script>

</body>
</html>
